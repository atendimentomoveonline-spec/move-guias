<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Guias INSS — Move Online</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;flex-direction:column}

    header{background:#1a2e4a;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
    .logo{font-size:22px;font-weight:700}.logo span{color:#2ecc8f}
    .logo-sub{font-size:12px;opacity:.75;margin-top:2px;color:#2ecc8f}

    main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px}

    .card{background:#fff;border-radius:18px;box-shadow:0 4px 28px rgba(0,0,0,.09);padding:40px 36px;width:100%;max-width:520px}
    .card h2{font-size:20px;color:#1a2e4a;margin-bottom:6px}
    .card .desc{font-size:14px;color:#64748b;margin-bottom:28px;line-height:1.5}

    label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:7px}
    .row{display:flex;gap:10px}
    input[type=text]{flex:1;padding:13px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;letter-spacing:1.5px;outline:none;transition:border .2s}
    input[type=text]:focus{border-color:#2ecc8f}

    .btn-buscar{padding:13px 22px;background:#2ecc8f;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
    .btn-buscar:hover{background:#27ae7a}
    .btn-buscar:disabled{background:#94a3b8;cursor:not-allowed}

    #resultado{margin-top:28px}

    .info-cliente{font-size:13px;color:#475569;margin-bottom:14px;padding:10px 14px;background:#f0fdf7;border-radius:8px;border-left:3px solid #2ecc8f}
    .info-cliente strong{color:#1a2e4a}

    .guia{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;transition:.2s}
    .guia:hover{box-shadow:0 2px 14px rgba(0,0,0,.09)}
    .guia-label{font-size:14px;font-weight:600;color:#1a2e4a}
    .guia-sub{font-size:11px;color:#94a3b8;margin-top:3px}

    .btn-dl{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:#2ecc8f;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0;transition:.2s}
    .btn-dl:hover{background:#27ae7a}

    .erro{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:14px 18px;font-size:14px}

    .spinner{display:none;width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#2ecc8f;border-radius:50%;animation:spin .7s linear infinite;margin:24px auto}
    @keyframes spin{to{transform:rotate(360deg)}}

    footer{text-align:center;padding:18px;font-size:12px;color:#94a3b8}

    @media(max-width:460px){
      .card{padding:28px 18px}
      .row{flex-direction:column}
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Move <span>Online</span></div>
    <div class="logo-sub">Contabilidade Digital</div>
  </div>
</header>

<main>
  <div class="card">
    <h2>📄 Minhas Guias INSS</h2>
    <p class="desc">Digite o CNPJ da sua empresa para acessar suas guias disponíveis para download.</p>

    <label for="cnpj">CNPJ da Empresa</label>
    <div class="row">
      <input type="text" id="cnpj" placeholder="00.000.000/0000-00"
             maxlength="18" autocomplete="off" inputmode="numeric">
      <button class="btn-buscar" id="btn" onclick="buscar()">Buscar</button>
    </div>

    <div class="spinner" id="spin"></div>
    <div id="resultado"></div>
  </div>
</main>

<footer>© 2026 Move Online Contabilidade · Todos os direitos reservados</footer>

<script>
const inp = document.getElementById('cnpj')
const btn = document.getElementById('btn')

inp.addEventListener('input', () => {
  let v = inp.value.replace(/\D/g,'').slice(0,14)
  if(v.length>12) v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/,'$1.$2.$3/$4-$5')
  else if(v.length>8) v=v.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})$/,'$1.$2.$3/$4')
  else if(v.length>5) v=v.replace(/^(\d{2})(\d{3})(\d{0,3})$/,'$1.$2.$3')
  else if(v.length>2) v=v.replace(/^(\d{2})(\d{0,3})$/,'$1.$2')
  inp.value=v
})
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') buscar() })

function cnpj(){ return inp.value.replace(/\D/g,'') }

async function buscar(){
  if(cnpj().length!==14){ mostrarErro('Digite um CNPJ válido com 14 dígitos.'); return }
  btn.disabled=true
  document.getElementById('spin').style.display='block'
  document.getElementById('resultado').innerHTML=''
  try{
    const r = await fetch('/api/guias',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cnpj:cnpj()})
    })
    const d = await r.json()
    r.ok ? mostrarGuias(d) : mostrarErro(d.erro||'Erro ao buscar.')
  }catch{ mostrarErro('Falha de conexão. Tente novamente.') }
  finally{
    btn.disabled=false
    document.getElementById('spin').style.display='none'
  }
}

function mostrarErro(msg){
  document.getElementById('resultado').innerHTML=`<div class="erro">⚠️ ${msg}</div>`
}

function mostrarGuias(d){
  let html=''
  if(d.cliente){
    html+=`<div class="info-cliente">Empresa: <strong>${d.cliente}</strong></div>`
  }
  d.guias.forEach(g=>{
    html+=`
    <div class="guia">
      <div>
        <div class="guia-label">${g.label}</div>
        <div class="guia-sub">PDF · Pronto para download</div>
      </div>
      <a class="btn-dl" href="${g.url}" download>⬇ Baixar</a>
    </div>`
  })
  document.getElementById('resultado').innerHTML=html
}
</script>
</body>
</html>
